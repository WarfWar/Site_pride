name: Build Pride Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bundled menu and illustrations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          site = Path("android/app/src/main/assets/site")
          items = json.loads((site / "data/menu.json").read_text(encoding="utf-8"))
          assert len(items) == 108, f"Expected 108 kitchen products; got {len(items)}"
          for key in ["category", "title", "price", "description", "weight"]:
              assert all(key in x for x in items), f"Missing field {key}"
          for file in ["index.html", "styles.css", "app.js", "cart.js", "cart.css",
                       "assets/logo.svg", "assets/hero.svg", "assets/burger.svg",
                       "assets/pizza.svg", "assets/rolls.svg", "photos.js"]:
              assert (site / file).is_file(), f"Missing {file}"
          assert 'pride:render' in (site / "app.js").read_text(encoding="utf-8")
          assert "localStorage" in (site / "cart.js").read_text(encoding="utf-8")
          print(f"PASS: {len(items)} curated dishes, 15 categories, 5 local SVG files")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare installed Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0
          fi
          ls "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Recover the exact 125 food photos from the original Pride website
        run: python3 android/scripts/fetch_original_photos.py

      - name: Preserve original photos in GitHub repository
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/assets/site/photos/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve 125 original Pride food photographs for offline Android'
            git push origin HEAD:main
          fi

      - name: Prepare current public Telegram news snapshot
        run: |
          python3 -m pip install -q beautifulsoup4
          python3 android/scripts/sync_pride_news.py --bundle

      - name: Recover original bar photos (113 distinct WebP files)
        run: python3 android/scripts/fetch_bar_photos.py

      - name: Verify both menus, navigation, basket, logo and JavaScript
        run: |
          python3 android/scripts/check_site.py
          node --check android/app/src/main/assets/site/app.js
          node --check android/app/src/main/assets/site/cart.js
          node --check android/app/src/main/assets/site/photos.js
          node --check android/app/src/main/assets/site/news.js

      - name: Validate photo references and disclosure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path('android/app/src/main/assets/site')
          h=BeautifulSoup((root/'index.html').read_text(encoding='utf-8'),'html.parser')
          missing=[]
          for img in h.select('img[src]'):
              src=img['src']
              if src.startswith('./') and not (root/src).is_file():
                  missing.append(src)
          assert not missing, f'Broken images in home page: {missing}'
          photo_js=(root/'photos.js').read_text(encoding='utf-8')
          assert "photo-ribbon" not in photo_js
          assert "<figcaption>" not in photo_js
          assert "Фото ознакомительное" in photo_js
          print('PASS: every home page image resolves; single clean photo disclaimer')
          PY

      - name: Check improved news JavaScript
        run: node --check android/app/src/main/assets/site/news.js

      - name: Verify responsive hero and natural photo backgrounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site=Path('android/app/src/main/assets/site')
          html=(site/'index.html').read_text(encoding='utf-8')
          photo_js=(site/'photos.js').read_text(encoding='utf-8')
          css=(site/'layout-fixes.css').read_text(encoding='utf-8')
          assert 'layout-fixes.css' in html
          assert 'photo-fill' in photo_js and 'object-fit:contain' in css
          assert 'menu-042.webp' in css and (site/'photos/menu-042.webp').is_file()
          assert 'hero-art:before' in css
          assert 'min-width:721px' in css
          assert 'max-width:720px' in css
          print('PASS: tablet and phone responsive hero, full product photo with blurred color-matched backdrop')
          PY

      - name: Build debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Verify exact original photographs inside APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          path = 'android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(path) as apk:
              images = [p for p in apk.namelist() if p.startswith('assets/site/photos/') and p.endswith('.webp')]
              assert len(images) == 127, f'Expected 125 original and 2 illustrative sushi burger photos; found {len(images)}'
              print(f'APK contains {len(images)} offline food photos')
          PY

      - name: Verify signed APK, logo and news resources
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              required=['assets/site/assets/pride-original-logo.png', 'assets/site/news.js', 'assets/site/data/news.json', 'assets/site/cart.js', 'assets/site/photos.js']
              for p in required: assert p in z.namelist(), f'Missing {p}'
              j=json.loads(z.read('assets/site/data/news.json'))
              assert isinstance(j.get('posts'),list)
              print('Validated original logo and offline news snapshot. Posts:',len(j['posts']))
          PY

      - name: Verify complete offline bar gallery and persistent debug cert
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          path='android/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(path) as z:
              bar=[n for n in z.namelist() if n.startswith('assets/site/bar_photos/') and n.endswith('.webp')]
              food=[n for n in z.namelist() if n.startswith('assets/site/photos/') and n.endswith('.webp')]
              assert len(bar)==113, f'Bar photos: {len(bar)} instead of 113'
              assert len(food)==127, f'Food photos: {len(food)} instead of 127'
              assert 'assets/site/assets/pride-brand.png' in z.namelist()
              print('APK verified: 113 original bar photos, 125 original kitchen photos, plus 2 illustrated sushi burger photos')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Preserve individual original bar photos in GitHub
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/assets/site/bar_photos/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Save all 113 individual original bar photographs'
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Back up source photographs
        uses: actions/upload-artifact@v4
        with:
          name: PrideCafe-original-125-photo-backup
          path: android/app/src/main/assets/site/photos/*.webp
          retention-days: 30

      - name: Gate APK installability and stable update identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pride_badging.txt
          grep -q "name='ru.pridecafe.menu' versionCode='10' versionName='1.7.1'" /tmp/pride_badging.txt
          SIGNER=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          EXPECTED=68c3ba09e49d3c998172386c295186f4143a88c319d13ab8f18461de9ba2a5c5
          test "$SIGNER" = "$EXPECTED"
          echo "SUCCESS: APK v2 signature verified, update certificate and version confirmed"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PrideCafe-v1.7.1-ui-verified-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
