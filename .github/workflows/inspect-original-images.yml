name: Inspect original Pride site image sources
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-original-images.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch original published site and extract image URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, pathlib, html
          from html.parser import HTMLParser
          url = "https://cafe-pride-menu.savory-heron-9771.chatgpt.site/"
          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; PrideMigration/1.0)", "Accept":"text/html,application/xhtml+xml"})
          try:
              with urllib.request.urlopen(req, timeout=35) as r:
                  raw = r.read(6_000_000)
                  print("HTTP status:",r.status,"final URL:",r.url,"type:",r.headers.get("Content-Type"),"bytes:",len(raw))
          except Exception as ex:
              print("FETCH_FAILED",type(ex).__name__,str(ex))
              raise
          content=raw.decode("utf-8",errors="replace")
          (out/"original.html").write_text(content,encoding="utf-8")
          print("HTML prefix:",re.sub(r"\s+"," ",content[:1600]))
          class Images(HTMLParser):
              def __init__(self): super().__init__();self.urls=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ("src","srcset","data-src","data-image","poster"):
                      if d.get(key) and (tag in ("img","source","video") or key=="data-image"):
                          self.urls.append((tag,key,d[key]))
          p=Images();p.feed(content)
          print("image tags:",len(p.urls))
          for row in p.urls[:90]:print("IMAGE_SRC:",row)
          print("next_data_path:",bool(re.search(r'__NEXT_DATA__|_next/static|/_astro/|/assets/',content)))
          (out/"image-report.json").write_text(json.dumps({"url":url,"tag_sources":p.urls,"total":len(p.urls)},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-pride-site-inspection
          path: inspection/
          retention-days: 5
