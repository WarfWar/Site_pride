name: Inspect original Pride site image sources
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-original-images.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch original published site and extract image URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, pathlib, html
          from html.parser import HTMLParser
          url = "https://cafe-pride-menu.savory-heron-9771.chatgpt.site/"
          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; PrideMigration/1.0)", "Accept":"text/html,application/xhtml+xml"})
          try:
              with urllib.request.urlopen(req, timeout=35) as r:
                  raw = r.read(6_000_000)
                  print("HTTP status:",r.status,"final URL:",r.url,"type:",r.headers.get("Content-Type"),"bytes:",len(raw))
          except Exception as ex:
              print("FETCH_FAILED",type(ex).__name__,str(ex))
              raise
          content=raw.decode("utf-8",errors="replace")
          (out/"original.html").write_text(content,encoding="utf-8")
          print("HTML prefix:",re.sub(r"\s+"," ",content[:1600]))
          class Images(HTMLParser):
              def __init__(self): super().__init__();self.urls=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ("src","srcset","data-src","data-image","poster"):
                      if d.get(key) and (tag in ("img","source","video") or key=="data-image"):
                          self.urls.append((tag,key,d[key]))
          p=Images();p.feed(content)
          print("image tags:",len(p.urls))
          for row in p.urls[:90]:print("IMAGE_SRC:",row)
          print("next_data_path:",bool(re.search(r'__NEXT_DATA__|_next/static|/_astro/|/assets/',content)))
          (out/"image-report.json").write_text(json.dumps({"url":url,"tag_sources":p.urls,"total":len(p.urls)},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Fetch original menu JavaScript, styles and image references
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, re, json, html
          from urllib.parse import urljoin
          base="https://cafe-pride-menu.savory-heron-9771.chatgpt.site/"
          out=pathlib.Path("inspection");out.mkdir(exist_ok=True)
          paths=["app.js","styles.css"]
          contents={}
          for path in paths:
              u=urljoin(base,path)
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=35) as r:data=r.read(4_000_000)
              s=data.decode("utf-8",errors="replace")
              contents[path]=s;(out/path).write_text(s,encoding="utf-8")
              print(path,"bytes:",len(data),"preview:",s[:900].replace(chr(10)," "))
          alltext="\n".join(contents.values())
          pats=[
             r'(?:(?:https?:)?//[^"\\\\\s<>]+\\.(?:jpg|png|webp|jpeg)(?:\\?[^"\\\\\s<>]*)?)',
             r'/assets/[^"\\\\\s<>]+\\.(?:jpg|png|webp|jpeg)',
             r'images\\.unsplash\\.com/[^"\\\\\s<>]+'
          ]
          hits=[]
          for pat in pats:
              for match in re.findall(pat,alltext,flags=re.I):
                  if match not in hits: hits.append(match)
          print("ASSET REFERENCES:",len(hits))
          for x in hits[:170]:print("ASSET:",x[:350])
          (out/"asset-refs.json").write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Fetch original menu.json and list actual photos
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, json, collections
          u='https://cafe-pride-menu.savory-heron-9771.chatgpt.site/menu.json'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as r: data=r.read(5_000_000)
          out=pathlib.Path('inspection');out.mkdir(exist_ok=True)
          (out/'menu.json').write_bytes(data)
          obj=json.loads(data)
          print('MENU JSON SIZE:',len(data),'ROOT:',type(obj).__name__)
          print('MENU CATEGORIES:', [(kind,len(cats)) for kind,cats in obj.items()] if isinstance(obj,dict) else '')
          for kind,cats in obj.items():
              entries=[(category.get('name'),item) for category in cats for item in category.get('items',[])]
              withphoto=[(cat,x.get('name'),x.get('image')) for cat,x in entries if x.get('image')]
              print('KIND',kind,'ITEMS',len(entries),'WITH_PHOTO',len(withphoto))
              for item in withphoto[:100]:print('PHOTO',repr(item))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-pride-site-inspection
          path: inspection/
          retention-days: 5
