name: Publish Pride Cafe site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site data and local illustrations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/menu.json').read_text(encoding='utf-8'))
          assert len(data) == 125, f'Expected 125 menu items; got {len(data)}'
          for name in ['index.html','styles.css','app.js','assets/logo.svg','assets/hero.svg','assets/burger.svg','assets/pizza.svg','assets/rolls.svg']:
              assert Path(name).is_file(), f'Missing: {name}'
          print('Site validated; menu items:', len(data))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
