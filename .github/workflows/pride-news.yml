name: Update Pride Telegram News
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "android/scripts/sync_pride_news.py"
      - ".github/workflows/pride-news.yml"
permissions:
  contents: write
concurrency:
  group: pride-telegram-news
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install parser dependency
        run: python3 -m pip install -q beautifulsoup4
      - name: Fetch channel's public posts
        run: python3 android/scripts/sync_pride_news.py
      - name: Commit news changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public Pride Telegram news feed"
            git push origin HEAD:main
          else
            echo "News unchanged; no commit"
          fi
